<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇象巡展 × FGO 怪东西问卷</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ========== 基础重置 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #ffffff;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            overflow: hidden; /* 页面不滚动，内部区域处理 */
        }

        /* ========== 主布局：左画布 + 右工作区 ========== */
        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            /* 总高度 = 视口 - 上下padding */
            height: calc(100vh - 24px);
        }

        /* ========== 左侧：画布区 (3:4，高度自适应视口) ========== */
        .canvas-wrapper {
            height: 100%;           /* 撑满可用高度 */
            aspect-ratio: 3 / 4;    /* 宽度按3:4自动计算 */
            flex-shrink: 0;
        }

        .canvas-area {
            width: 100%;
            height: 100%;
            background: #0a0a0a;    /* 黑底 */
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        /* ----- 顶部标题区 (占画布高度 14%) ----- */
        .canvas-header {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 14%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;     
            text-align: center;       
        }
        .canvas-header h2 {
            font-size: clamp(6px, 3.2vw, 36px);
            margin-top: 1.5vw;          /* ← 新增：标题距离画布顶端1vw */
            margin-bottom: 1%;
            letter-spacing: 2px;
            font-weight: 600;
        }
        .canvas-header .subtitle {
            font-size: clamp(5px, 1.8vw, 32px);
            color: #888;
            margin-bottom: 2%;
        }
        .canvas-header .name-line {
            font-size: clamp(5px, 1.5vw, 32px);
            color: #aaa;
        }
        .canvas-header .name-line input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #555;
            color: #fff;
            font-size: inherit;
            width: 45%;
            outline: none;
            padding: 1px 4px;
            font-family: inherit;
        }

        /* ----- 主体内容区 (占画布高度 86%) ----- */
        .canvas-body {
            position: absolute;
            top: 14%; left: 0;
            width: 100%;
            height: 86%;
            display: flex;
            padding: 2% 3% 3% 3%;
            gap: 3%;
        }

        /* 左右两个半区 */
        .half-zone {
            width: 48%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 0%;
        }

        /* 每行：拼图区 + 文字区 */
        .row {
            flex: 1;
            display: flex;
            gap: 4%;
            align-items: center;
        }

        /* 拼图区：方形，用 aspect-ratio 保持 */
        .puzzle-cell {
            height: 95%;
            aspect-ratio: 2 / 3;
            border-radius: 1%;
            overflow: hidden;
            position: relative;
            background: url("images/background.png") center/cover no-repeat;
            border: 1.5px dashed #3a3a4a;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .puzzle-cell:hover {
            border-color: #666;
        }
        .puzzle-cell.active {
            border-color: #e94560;
            box-shadow: 0 0 0 2px rgba(233,69,96,0.3);
        }
        .puzzle-cell .placeholder {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3a3a4a;
            font-size: clamp(7px, 1.3vw, 12px);
            text-align: center;
            padding: 10%;
            pointer-events: none;
            line-height: 1.6;
        }

        /* 拼图区内部 A区(背景图) */
        .puzzle-a {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 1%;
            overflow: hidden;
        }
        .puzzle-a img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 拼图区内部 B区(PNG透明叠加) */
        .puzzle-b {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .puzzle-b img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
        }

        /* 拼图区内部 C&D 遮罩层 */
        .puzzle-mask-c, .puzzle-mask-d {
            position: absolute;
            z-index: 5;
            background: #0a0a0a;
            display: none;
        }

        /* 文字输入区 */
        .text-cell {
            flex: 1;
            height: 95%;
            display: flex;
            align-items: center;
        }
        .text-cell textarea {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #2a2a3a;
            border-radius: 1px;
            color: #ffffff;
            padding: 0 8px;           /* 上下padding清0，左右保留 */
            font-size: 24px;
            resize: none;
            outline: none;
            line-height: 1.4;
            font-family: inherit;
            overflow: hidden;
            text-align: left;         /* 文字左对齐 */
            display: flex;
            align-items: center;      /* placeholder和内容垂直居中 */
            appearance: none;         /* 清除浏览器默认内边距 */
        }
        .text-cell textarea:focus {
            border-color: #444;
        }
        .text-cell textarea::placeholder {
            color: #333;
            display: flex;
            align-items: center;
        }

        /* ========== 右侧：工作区 (高度与画布对齐，内部可滚动) ========== */
        .workspace {
            height: 100%;
            flex: 1;
            max-width: 420px;
            min-width: 260px;
            overflow: hidden;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;   /* ← 新增：B贴顶、快照贴底、A居中，间隙自动分配 */
        }
        .workspace::-webkit-scrollbar { width: 5px; }
        .workspace::-webkit-scrollbar-track { background: transparent; }
        .workspace::-webkit-scrollbar-thumb { background: #3a3a5c; border-radius: 3px; }

        .tool-section {
            background: #151520;
            border-radius: 12px;
            padding: 10px 14px;
            border: 1px solid #2a2a4a;
            margin-bottom: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #toolB { height: 45%; }
        #toolA { height: 35%; }
        .tool-section:last-child {
            height: 15%;
            flex-shrink: 0;
            justify-content: center;
        }

        .section-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            margin: 6px 0;
        }
        .section-content::-webkit-scrollbar { width: 4px; }
        .section-content::-webkit-scrollbar-thumb { background: #3a3a5c; border-radius: 2px; }

        .search-box {
            width: 100%;
            padding: 6px 10px;
            background: #0f0f1a;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            color: #ccc;
            font-size: 12px;
            outline: none;
            margin: 1em 0;          /* ← 改：上下各留0.3行间距 */
        }
        .search-box:focus { border-color: #e94560; }

        /* B区：高度15vh锁定，比例2:3，一行几张自适应窗口宽度 */
        #gridB {
            display: grid;
            grid-template-columns: repeat(auto-fill, calc(15vh * 2 / 3));
            gap: 6px;
            justify-content: center;
        }
        #gridB .preset-item {
            height: 15vh;
            width: calc(15vh * 2 / 3);
            aspect-ratio: 2 / 3;
            border-radius: 4px;
        }

        /* A区：高度6vh锁定，比例1:1，一行几张自适应窗口宽度 */
        #gridA {
            display: grid;
            grid-template-columns: repeat(auto-fill, 6vh);
            gap: 6px;
            justify-content: center;
        }
        #gridA .preset-item {
            height: 6vh;
            width: 6vh;
            aspect-ratio: 1 / 1;
            border-radius: 4px;
        }

        .preset-item {
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            background: #0f0f1a;
            position: relative;
        }
        .preset-item:hover { border-color: #e94560; transform: scale(1.02); }
        .preset-item.selected { border-color: #e94560; }
        .preset-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .preset-item::after {
            content: attr(data-name);
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 10px;
            padding: 3px 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .preset-item:hover::after { opacity: 1; }

        .upload-btn {
            display: block; width: 100%;
            padding: 8px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
            margin: 0.5em 0;
        }
        .upload-btn:hover { background: #c73e54; }

        .hint { font-size: 11px; color: #555; margin-top: 6px; line-height: 1.4; }

        .action-buttons { display: flex; gap: 8px; margin-top: 4px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: opacity 0.2s; margin: 0.5em 0;  }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #e94560; color: white; }
        .btn-secondary { background: #1a1a2e; color: #aaa; border: 1px solid #333; }

        input[type="file"] { display: none; }

        /* ========== 快照预览弹窗 ========== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #151520; border-radius: 12px; padding: 16px;
            max-width: 480px; width: 100%; text-align: center;
            border: 1px solid #2a2a4a;
        }
        .modal-content h3 { margin-bottom: 12px; }
        .modal-content img { max-width: 100%; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .modal-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }

        /* ========== 移动端适配 ========== */
        @media (max-width: 768px) {
            body { overflow-y: auto; padding: 10px; }
            .main-layout { flex-direction: column; height: auto; gap: 14px; align-items: center; }
            .canvas-wrapper { width: 100%; max-width: 400px; height: auto; aspect-ratio: 3/4; }
            .workspace { width: 100%; max-width: 400px; height: auto; overflow-y: visible; padding-right: 0; }
            .preset-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
<base target="_blank">

<body>
    <div class="main-layout">
        <!-- ==================== 画布区 ==================== -->
        <div class="canvas-wrapper">
            <div class="canvas-area" id="captureArea">
                <!-- 顶部标题 -->

                <div class="canvas-body">

                                <div class="puzzle-a"><img id="imgA-2" alt=""></div>
                                <div class="puzzle-b"><img id="imgB-2" alt=""></div>
                                <div class="puzzle-mask-c" id="maskC-2"></div>
                                <div class="puzzle-mask-d" id="maskD-2"></div>
                            </div>
                            <div class="text-cell">
                                <textarea placeholder="在此输入文字..." id="text-2"></textarea>
                            </div>
                        </div>
                        <div class="row">
                            <div class="puzzle-cell" id="puzzle-3" onclick="selectPuzzle(3)">
                                <div class="placeholder">① 点击区域<br>② 在工作区选择图片</div>
                                <div class="puzzle-a"><img id="imgA-3" alt=""></div>
                                <div class="puzzle-b"><img id="imgB-3" alt=""></div>
                                <div class="puzzle-mask-c" id="maskC-3"></div>
                                <div class="puzzle-mask-d" id="maskD-3"></div>

                    <!-- 右半区：拼图4~6 + 文字4~6 -->
                    <div class="half-zone">
                        <div class="row">
                            <div class="puzzle-cell" id="puzzle-4" onclick="selectPuzzle(4)">
                                <div class="placeholder">① 点击区域<br>② 在工作区选择图片</div>
                                <div class="puzzle-a"><img id="imgA-4" alt=""></div>

                            <div class="text-cell">
                                <textarea placeholder="在此输入文字..." id="text-4"></textarea>

                            <div class="puzzle-cell" id="puzzle-5" onclick="selectPuzzle(5)">
                                <div class="placeholder">① 点击区域<br>② 在工作区选择图片</div>
                                <div class="puzzle-a"><img id="imgA-5" alt=""></div>
                                <div class="puzzle-b"><img id="imgB-5" alt=""></div>
                                <div class="puzzle-mask-c" id="maskC-5"></div>
                                <div class="puzzle-mask-d" id="maskD-5"></div>
                            </div>
                            <div class="text-cell">
                                <textarea placeholder="在此输入文字..." id="text-5"></textarea>

                        <div class="row">
                            <div class="puzzle-cell" id="puzzle-6" onclick="selectPuzzle(6)">
                                <div class="placeholder">① 点击区域<br>② 在工作区选择图片</div>
                                <div class="puzzle-a"><img id="imgA-6" alt=""></div>
                                <div class="puzzle-b"><img id="imgB-6" alt=""></div>
                                <div class="puzzle-mask-c" id="maskC-6"></div>
                                <div class="puzzle-mask-d" id="maskD-6"></div>

                </div>

        </div>

        <!-- ==================== 工作区 (可滚动) ==================== -->
        <div class="workspace">
        <div class="tool-section" id="toolB">
            <h3>✨ 明日方舟人物模型选择</h3>
            <input type="text" class="search-box" placeholder="🔍 搜索文件名..." oninput="filterImages('b', this.value)">
            <div class="section-content">
                <div class="preset-grid" id="gridB"></div>
            </div>
            <p class="hint">鼠标悬浮缩略图查看角色名。</p>
        </div>

        <div class="tool-section" id="toolA">
            <h3>🖼️ 画像选择 / 上传</h3>
            <input type="text" class="search-box" placeholder="🔍 搜索文件名..." oninput="filterImages('a', this.value)">
            <div class="section-content">
                <div class="preset-grid" id="gridA"></div>
            </div>
            <button class="upload-btn" onclick="document.getElementById('uploadA').click()">📁 上传本地图片</button>
            <input type="file" id="uploadA" accept="image/*" onchange="handleUpload(event, 'a')">
            <p class="hint">鼠标悬浮缩略图可查看技能件名，或另行上传其他图片。</p>
        </div>

            <div class="tool-section">
                <h3>📸 生成图片</h3>
                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="capture()">图片导出</button>
                    <button class="btn btn-secondary" onclick="resetAll()">重置全部</button>
                </div>
                <p class="hint">如生成失败，请检查浏览器是否允许弹窗。</p>
            </div>

    <!-- ==================== 预览弹窗 ==================== -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h3>📷 图片预览</h3>
            <img id="previewImg" alt="快照预览">
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="downloadImage()">💾 保存到本地</button>
                <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // 配置区：填入 images/A/ 和 images/B/ 下的图片
        // =====================================================
        let presetImages = { a: [], b: [] };

        async function loadImages() {
            try {
                const res = await fetch('images.json');
                presetImages = await res.json();
            } catch (e) {
                console.error('加载图片列表失败', e);
            }
            renderGrid('a');
            renderGrid('b');
        }

        function init() {
            loadImages();
        }

        function renderGrid(type, filter = '') {
            const grid = document.getElementById('grid' + type.toUpperCase());
            grid.innerHTML = '';
            let list = presetImages[type] || [];
            if (filter) {
                list = list.filter(item => (item.name || '').toLowerCase().includes(filter.toLowerCase()));
            }
            if (list.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;color:#444;font-size:12px;padding:16px;text-align:center;">无图片</div>';
                return;
            }
            list.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'preset-item';
                div.setAttribute('data-name', item.name || '未命名');
                div.title = item.name || '';
                div.onclick = () => applyImage(type, item.file);
                const img = document.createElement('img');
                img.src = item.file;
                img.alt = item.name || '';
                img.onerror = () => {
                    div.innerHTML = '<span style="color:#444;font-size:10px;display:flex;align-items:center;justify-content:center;height:100%;">' + (item.name || '?') + '</span>';
                };
                div.appendChild(img);
                grid.appendChild(div);
            });
        }

        function filterImages(type, keyword) {
            renderGrid(type, keyword);
        }

        // =====================================================
        // 选择拼图区
        // =====================================================
        function selectPuzzle(id) {
            // 移除所有旧选中状态
            for (let i = 1; i <= 6; i++) {
                document.getElementById('puzzle-' + i).classList.remove('active');
            }
            document.getElementById('puzzle-' + id).classList.add('active');
            currentPuzzleId = id;
        }

        // =====================================================
        // 应用图片到当前选中的拼图区
        // =====================================================
        function applyImage(type, src) {
            if (!currentPuzzleId) {
                alert('请先点击左侧任意一个拼图区');
                return;
            }
            puzzleData[currentPuzzleId][type] = src;

            if (type === 'a') {
                const img = document.getElementById('imgA-' + currentPuzzleId);
                img.src = src;
                img.style.display = 'block';
                document.querySelector('#puzzle-' + currentPuzzleId + ' .placeholder').style.display = 'none';
            } else {
                const img = document.getElementById('imgB-' + currentPuzzleId);
                img.src = src;
                img.style.display = 'block';
            }
        }

        // =====================================================
        // 本地上传 (仅A区)
        // =====================================================
        function handleUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件');
                return;
            }
            if (!currentPuzzleId) {
                alert('请先点击左侧一个拼图区');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                applyImage(type, e.target.result);
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // =====================================================
        // 截图生成
        // =====================================================
        async function capture() {
            const area = document.getElementById('captureArea');
            const btn = document.querySelector('.btn-primary');
            const orig = btn.innerText;
            btn.innerText = '生成中...';
            btn.disabled = true;

            try {
                const canvas = await html2canvas(area, {
                    backgroundColor: '#0a0a0a',  // 黑底
                    scale: 2,                     // 2倍高清
                    useCORS: true,
                    allowTaint: true,
                    logging: false
                });

                captureDataUrl = canvas.toDataURL('image/png');
                document.getElementById('previewImg').src = captureDataUrl;
                document.getElementById('modal').classList.add('active');
            } catch (err) {
                console.error(err);
                alert('生成失败，请检查图片是否正常加载');
            } finally {
                btn.innerText = orig;
                btn.disabled = false;
            }
        }

        function downloadImage() {
            if (!captureDataUrl) return;
            const a = document.createElement('a');
            a.download = 'FGO怪东西问卷_' + Date.now() + '.png';
            a.href = captureDataUrl;
            a.click();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function resetAll() {
            if (!confirm('确定要清空所有拼图和文字吗？')) return;
            for (let i = 1; i <= 6; i++) {
                puzzleData[i] = { a: null, b: null };
                document.getElementById('imgA-' + i).style.display = 'none';
                document.getElementById('imgB-' + i).style.display = 'none';
                document.getElementById('text-' + i).value = '';
                document.querySelector('#puzzle-' + i + ' .placeholder').style.display = 'flex';
                document.getElementById('puzzle-' + i).classList.remove('active');
            }
            document.getElementById('nameInput').value = '';
            currentPuzzleId = null;
        }

        // 点击遮罩关闭弹窗
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });
        // ESC 关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        init();
                
        document.querySelectorAll('.text-cell textarea').forEach(ta => {
            ta.addEventListener('input', function() {
                this.style.fontSize = '24px';
                this.style.height = 100;
                const maxH = this.parentElement.clientHeight;
                while (this.scrollHeight > maxH && parseInt(this.style.fontSize) > 10) {
                    this.style.fontSize = (parseInt(this.style.fontSize) - 1) + 'px';
                }
            });
        });
    </script>
</body>
</html>
